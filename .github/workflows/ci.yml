name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DJANGO_SECRET_KEY: ci-only-not-secret
  DJANGO_DEBUG: "true"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (format)
        run: uv run ruff format --check .
      - name: Mypy (types)
        run: uv run mypy .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: flaky
          POSTGRES_PASSWORD: flaky
          POSTGRES_DB: flaky_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flaky"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://flaky:flaky@localhost:5432/flaky_tracker
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Tests
        run: uv run pytest --junitxml=reports/junit.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: reports/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t flaky-tracker:ci .
