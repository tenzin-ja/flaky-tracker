name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: flaky
          POSTGRES_PASSWORD: flaky
          POSTGRES_DB: flaky_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flaky"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://flaky:flaky@localhost:5432/flaky_tracker_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest --junitxml=reports/junit.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: reports/
