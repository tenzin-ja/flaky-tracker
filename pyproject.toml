[project]
name = "flaky-tracker"
version = "0.1.0"
description = "A GitHub App that detects flaky tests from CI results and explains failures on pull requests."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Tenzin Jamyang" }]
dependencies = [
    "celery>=5.6",
    "defusedxml>=0.7",
    "django>=6.1",
    "django-environ>=0.14",
    "gunicorn>=26.0",
    "httpx>=0.28",
    "psycopg[binary]>=3.3",
    "pyjwt[crypto]>=2.15",
    "redis>=8.0",
    "whitenoise>=6.12",
]

[dependency-groups]
dev = [
    "celery-types>=0.26",
    "django-stubs[compatible-mypy]>=6.1",
    "mypy>=2.4",
    "pytest>=9.1",
    "pytest-django>=4.14",
    "respx>=0.23",
    "ruff>=0.17",
    "types-defusedxml>=0.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "DJ"]
ignore = ["S101"]  # assert is fine in tests

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["mypy_django_plugin.main"]
exclude = ["/migrations/"]

[[tool.mypy.overrides]]
module = ["environ.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"
