[project]
name = "flaky-tracker"
version = "0.1.0"
description = "A GitHub App that detects flaky tests from CI results and explains failures on pull requests."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Tenzin Jamyang" }]
dependencies = [
    "fastapi>=0.150",
    "uvicorn[standard]>=0.50",
    "sqlalchemy>=2.0",
    "alembic>=1.18",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.10",
    "httpx>=0.28",
    "pyjwt[crypto]>=2.10",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "respx>=0.22",
    "ruff>=0.15",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is fine in tests
